name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json # 👈 importante si usas npm

    - name: Install dependencies
      working-directory: ./Cibertec_Frontend   # 👈 entra a la carpeta frontend
      run: npm install

    - name: Build project
      working-directory: ./Cibertec_Frontend
      run: npm run build

    # (opcional)
    - name: Run tests
      working-directory: ./Cibertec_Frontend
      run: npm test
